services:
  app:
    image: ${DOCKER_IMAGE:-tmail-suite:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmail-suite
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - tmail-suite_data:/root/.tmail-suite
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/root/.tmail-suite/db/tmail.db"
      ATTACHMENTS_DIR: "/root/.tmail-suite/attachments"
      APP_URL: "${APP_URL:-http://localhost:3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  tmail-suite_data:
