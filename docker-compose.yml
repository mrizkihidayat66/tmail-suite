services:
  app:
    image: ${DOCKER_IMAGE:-tmail-suite:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmail-suite
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - tmail-suite_data:/root/.tmail-suite
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/root/.tmail-suite/db/tmail.db"
      ATTACHMENTS_DIR: "/root/.tmail-suite/attachments"
      # APP_URL: Set to externally-accessible URL if behind reverse proxy
      # e.g. https://mail.yourdomain.com or http://192.168.1.100:8027
      # Leave default for local development
      APP_URL: "${APP_URL:-http://localhost:3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tmail-suite_data:
